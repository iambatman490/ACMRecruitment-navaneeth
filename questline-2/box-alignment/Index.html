<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Alignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <h1>Box Alignment Controller</h1>
    <div class="controls">
      <button id="btn-horizontal" class="btn active">Horizontal</button>
      <button id="btn-vertical" class="btn">Vertical</button>
    </div>
  </header>

  <!-- Container for the 4 boxes -->
  <main class="viewport">
    <div id="box-container" class="container layout-horizontal">
      <div class="box box-1">Box 1</div>
      <div class="box box-2">Box 2</div>
      <div class="box box-3">Box 3</div>
      <div class="box box-4">Box 4</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
